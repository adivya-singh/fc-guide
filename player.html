<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.gstatic.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../style.css" />
    <title>Lionel Messi | THE FC GUIDE</title>
  </head>
  <body>
    <div class="container">
      <header class="player-header">
        <a href="../index.html" class="back-link">&larr; Back to squad guide</a>
        <div class="player-hero">
          <img id="player-image" src="" alt="" class="player-image" />
          <div class="player-info">
            <p class="player-category" id="player-position"></p>
            <h1 id="player-name"></h1>

            <p class="player-nickname" id="player-nickname"></p>
            <div class="player-meta">
              <span
                ><strong>Rating:</strong> <span id="player-rating"></span
              ></span>
              <span
                ><strong>Position:</strong> <span id="player-roles"></span
              ></span>
              <span
                ><strong>Nation:</strong> <span id="player-nation"></span
              ></span>
              <span><strong>Card:</strong> <span id="player-card"></span></span>
            </div>
          </div>
        </div>
      </header>
      <section class="player-section">
        <h2>Player Overview</h2>
        <p class="player-bio" id="player-review"></p>
      </section>
      <section class="player-section">
        <h2>Key Strengths</h2>
        <ul class="player-strengths" id="player-pros"></ul>
      </section>
      <section class="player-section">
        <h2>Watch Out For</h2>
        <p class="player-weakness" id="player-cons"></p>
      </section>
      <footer>Copyright &copy;2026 by Adivya Singh.</footer>
    </div>
    <script src="player.js"></script>
  </body>
</html>
